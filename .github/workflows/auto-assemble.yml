name: Auto Assemble PNOS-docker

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-assemble
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  check-and-assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check versions and trigger if needed
        run: |
          # 获取 pnos-web 最新成功构建时间
          a_time=$(curl -s "https://api.github.com/repos/PandaNetOS/pnos-web/actions/runs?status=success&per_page=1" | jq -r '.workflow_runs[0].updated_at // empty')
          # 获取 pnos-runtime 最新成功构建时间
          b_time=$(curl -s "https://api.github.com/repos/PandaNetOS/pnos-runtime/actions/runs?status=success&per_page=1" | jq -r '.workflow_runs[0].updated_at // empty')
          # 获取 PNOS-docker 最新成功构建时间
          c_time=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/PandaNetOS/PNOS-docker/actions/runs?status=success&per_page=1" | jq -r '.workflow_runs[0].updated_at // empty')

          echo "pnos-web latest:     ${a_time:-none}"
          echo "pnos-runtime latest: ${b_time:-none}"
          echo "PNOS-docker latest:  ${c_time:-none}"

          # a 和 b 都没有成功构建，跳过
          if [ -z "$a_time" ] && [ -z "$b_time" ]; then
            echo "No successful component builds yet, skip"
            exit 0
          fi

          # 取 a 和 b 的最新时间
          latest=$a_time
          if [ -z "$latest" ] || [[ "$b_time" > "$latest" ]]; then
            latest=$b_time
          fi
          echo "Latest component build: $latest"

          # c 没构建过，或者 c 早于组件最新构建，才需要触发
          if [ -n "$c_time" ] && [[ "$c_time" > "$latest" ]]; then
            echo "PNOS-docker already up to date, skip"
            exit 0
          fi

          # 去重：检查是否有正在运行的构建
          running=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/PandaNetOS/PNOS-docker/actions/runs?per_page=10" | \
            jq -r '[.workflow_runs[] | select(.status == "in_progress")] | length')
          if [ "$running" -gt 0 ]; then
            echo "PNOS-docker build already in progress ($running), skip"
            exit 0
          fi

          # 触发构建
          echo "Triggering PNOS-docker build..."
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/PandaNetOS/PNOS-docker/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Build triggered"
