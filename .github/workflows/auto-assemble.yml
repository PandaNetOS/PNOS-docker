name: Auto Assemble PNOS-docker

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-assemble
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  check-and-assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check versions and trigger if needed
        run: |
          # 获取 pnos-web 最新成功构建完成时间
          a_time=$(curl -s "https://api.github.com/repos/PandaNetOS/pnos-web/actions/runs?status=success&per_page=1" | jq -r '.workflow_runs[0].updated_at // empty')
          # 获取 pnos-runtime 最新成功构建完成时间
          b_time=$(curl -s "https://api.github.com/repos/PandaNetOS/pnos-runtime/actions/runs?status=success&per_page=1" | jq -r '.workflow_runs[0].updated_at // empty')
          # 获取 PNOS-docker build.yml 最新构建的开始时间（只看 build workflow）
          c_start=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/PandaNetOS/PNOS-docker/actions/workflows/build.yml/runs?per_page=1" | jq -r '.workflow_runs[0].created_at // empty')

          echo "pnos-web completed:     ${a_time:-none}"
          echo "pnos-runtime completed: ${b_time:-none}"
          echo "PNOS-docker build started: ${c_start:-none}"

          # a 和 b 都没有成功构建，跳过
          if [ -z "$a_time" ] && [ -z "$b_time" ]; then
            echo "No successful component builds yet, skip"
            exit 0
          fi

          # 取 a 和 b 的最新完成时间
          latest=$a_time
          if [ -z "$latest" ] || [[ "$b_time" > "$latest" ]]; then
            latest=$b_time
          fi
          echo "Latest component build: $latest"

          # 用 c 的开始时间比较：如果 c 开始构建时组件都已完成，说明已是最新
          if [ -n "$c_start" ] && [[ "$c_start" > "$latest" ]]; then
            echo "PNOS-docker build started after all components completed, up to date, skip"
            exit 0
          fi
          echo "PNOS-docker needs rebuild"

          # 去重：只检查 build.yml 是否有正在运行的构建
          running=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/PandaNetOS/PNOS-docker/actions/workflows/build.yml/runs?per_page=1&status=in_progress" | jq -r '.total_count')
          if [ "$running" -gt 0 ]; then
            echo "PNOS-docker build already in progress ($running), will retry next cycle"
            exit 0
          fi

          # 触发构建
          echo "Triggering PNOS-docker build..."
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/PandaNetOS/PNOS-docker/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Build triggered"
