name: Build & Push PNOS-docker Docker Image

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  get-versions:
    runs-on: ubuntu-latest
    outputs:
      web_version: ${{ steps.get.outputs.web_version }}
      runtime_version: ${{ steps.get.outputs.runtime_version }}
    steps:
      - id: get
        run: |
          web=$(curl -s https://api.github.com/repos/PandaNetOS/pnos-web/tags | jq -r '.[0].name')
          runtime=$(curl -s https://api.github.com/repos/PandaNetOS/pnos-runtime/tags | jq -r '.[0].name')
          echo "web_version=$web" >> $GITHUB_OUTPUT
          echo "runtime_version=$runtime" >> $GITHUB_OUTPUT
          echo "pnos-web: $web, pnos-runtime: $runtime"

  build:
    needs: get-versions
    uses: PandaNetOS/PandaNetOS/.github/workflows/reusable-release-docker-image.yml@main
    with:
      image_name: pnos-docker
      platforms: linux/amd64
      push_to_ghcr: true
      push_to_dockerhub: true
      push_to_aliyun: true
      tag_latest: true
      tag_sha: true
      custom_tags: |
        type=raw,value=front-${{ needs.get-versions.outputs.web_version }}_backend-${{ needs.get-versions.outputs.runtime_version }}
      build_args: '{"WEB_VERSION":"${{ needs.get-versions.outputs.web_version }}","RUNTIME_VERSION":"${{ needs.get-versions.outputs.runtime_version }}"}'
      provenance: false
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
      ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
      ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
      ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
