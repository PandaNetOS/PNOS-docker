services:
  pnos:
    build: .
    image: pandanetos/pnos:latest
    container_name: pnos
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - pnos_data:/data
      - ./media:/media
    environment:
      - PNOS_PORT=80
      - PNOS_DATA_DIR=/data
      - PNOS_MEDIA_DIR=/media
      - RUST_LOG=info

volumes:
  pnos_data:
