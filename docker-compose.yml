services:
  pnos:
    build: .
    image: registry.cn-hangzhou.aliyuncs.com/你的命名空间/PNOS-docker:latest
    container_name: pnos
    restart: unless-stopped
    ports:
      - "5540:80"
    volumes:
      - ./data:/data
      - ./media:/media
    environment:
      - PNOS_PORT=80
      - PNOS_DATA_DIR=/data
      - PNOS_MEDIA_DIR=/media
      - RUST_LOG=info
